<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>外贸助手 · 执行台</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: #1c2d47; background: #f4f7fb; font: 14px/1.6 "Microsoft YaHei", "PingFang SC", sans-serif; }
  .page { max-width: 100%; margin: 0 auto; padding: 14px 12px 40px; }
  .draft { font-size: 13px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; color: #fff; background: #1858c9; font-weight: 700; }
  .brand b { font-size: 15px; }
  .brand small { display: block; color: #6b7e96; font-size: 11px; }
  button { min-height: 32px; padding: 6px 12px; border: 0; border-radius: 8px; background: #1858c9; color: #fff; font: 700 13px "Microsoft YaHei", sans-serif; cursor: pointer; }
  button.ghost { background: #eef4ff; color: #1858c9; }
  button.sm { min-height: 27px; padding: 3px 9px; font-size: 12px; }
  .card { background: #fff; border: 1px solid #dfe7f1; border-radius: 12px; padding: 14px 16px; }
  .card + .card { margin-top: 12px; }
  h3 { margin: 0 0 4px; font-size: 15px; }
  .hint { margin: 0 0 10px; color: #8292a7; font-size: 12px; }
  .item { border-top: 1px solid #eef2f8; padding: 12px 0; }
  .item:first-child { border-top: 0; }
  .row { display: flex; justify-content: space-between; gap: 10px; }
  .who { font-weight: 700; }
  .meta { color: #8292a7; font-size: 12px; }
  .draft { white-space: pre-wrap; background: #f8fafd; border: 1px solid #e6eef8; border-radius: 8px; padding: 9px 11px; margin: 8px 0; font-size: 13px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .status { font-size: 12px; font-weight: 600; color: #6b7e96; min-height: 18px; margin: 8px 0 0; }
  .status.err { color: #b91c1c; }
  .status.ok { color: #15803d; }
  .gate-ok { color: #15803d; font-weight: 700; }
  .gate-block { color: #b45309; font-weight: 700; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div class="brand"><span class="mark">贸</span><span><b>智能体侧栏</b><small>与阿里页面同窗并排</small></span></div>
    <div class="actions">
      <button class="ghost sm" id="open-ali">打开阿里国际站</button>
      <button class="ghost sm" id="open-console">完整工作台</button>
      <button class="ghost sm" id="regexec">刷新</button>
      <button class="ghost sm" id="open-options">设置</button>
    </div>
  </div>

  <div class="card" id="main">
    <h3>待执行</h3>
    <p class="hint">在右侧侧栏里复制话术，左边阿里聊天窗口粘贴发送，再回来标记结果。</p>
    <div id="list"></div>
    <p class="status" id="status">加载中…</p>
  </div>
</div>
<script src="src/executor.js"></script>
</body>
</html>
