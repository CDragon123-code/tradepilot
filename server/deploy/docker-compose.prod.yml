name: ali-cloud

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ali_cloud}
      POSTGRES_USER: ${POSTGRES_USER:-ali}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ali} -d ${POSTGRES_DB:-ali_cloud}"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-ali}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ali_cloud}}
      INGEST_TOKEN: ${INGEST_TOKEN:-${API_TOKEN:-}}
      READ_TOKEN: ${READ_TOKEN:-${API_TOKEN:-}}
      FEISHU_WEBHOOK: ${FEISHU_WEBHOOK:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_CHAT_ID: ${FEISHU_CHAT_ID:-}
      SECRET_KEY: ${SECRET_KEY:-}
      DIFY_BASE_URL: ${DIFY_BASE_URL:-https://api.dify.ai/v1}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
      SELLER_ID: ${SELLER_ID:-seller-main}
      SELLER_IDS: ${SELLER_IDS:-}
      TENANT_ID: ${TENANT_ID:-default}
      PORT: 8787
      TZ: ${TZ:-Asia/Shanghai}
    expose:
      - "8787"
    volumes:
      # 扩展自动更新文件：把 latest.zip / version.json 放到 server/releases/ 即可生效，无需重建
      - ../releases:/app/releases:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?请在 .env 设置 DOMAIN}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./logs:/var/log/caddy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  caddy_data:
  caddy_config:
